name: Build and Release Standalone Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TextToSpeechBatch.exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest test_tts.py -v

      - name: Build standalone executable with PyInstaller
        run: |
          python -m PyInstaller --onefile --windowed --name TextToSpeechBatch --noconfirm --collect-all google.genai --collect-all lameenc --collect-all docx --clean tts_gui.py

      - name: Verify executable with self-test
        run: |
          dist\TextToSpeechBatch.exe --selftest

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextToSpeechBatch-Windows
          path: dist/TextToSpeechBatch.exe
          if-no-files-found: error

      - name: Create GitHub Release and Upload Exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Text to Speech Batch ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/TextToSpeechBatch.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
